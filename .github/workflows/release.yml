name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example v1.1.1)
        required: true
        default: v1.1.0
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || 'v1.1.0' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check whether release already exists
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_VERSION *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -q --upgrade pip
          python -m pip install --disable-pip-version-check -q -r requirements.txt pyinstaller

      - name: Collect third-party notices
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path third_party_licenses | Out-Null
          @'
          from pathlib import Path
          import hashlib
          import importlib.metadata as md
          import shutil
          import subprocess
          import sys
          import tkinter
          import imageio_ffmpeg

          out = Path("third_party_licenses")
          out.mkdir(exist_ok=True)

          def copy_distribution_notices(dist_name: str, prefix: str) -> None:
              dist = md.distribution(dist_name)
              copied = 0
              for entry in dist.files or []:
                  name = Path(str(entry)).name.lower()
                  if not (name.startswith("license") or name.startswith("copying") or name.startswith("notice")):
                      continue
                  source = Path(dist.locate_file(entry))
                  if not source.is_file():
                      continue
                  copied += 1
                  destination = out / f"{prefix}_{copied}_{source.name}"
                  shutil.copy2(source, destination)

          copy_distribution_notices("imageio-ffmpeg", "IMAGEIO_FFMPEG")
          copy_distribution_notices("tkinterdnd2", "TKINTERDND2")
          copy_distribution_notices("pyinstaller", "PYINSTALLER")

          base = Path(sys.base_prefix)
          python_candidates = [
              base / "LICENSE.txt",
              base / "LICENSE",
              Path(sys.executable).parent / "LICENSE.txt",
          ]
          for candidate in python_candidates:
              if candidate.is_file():
                  shutil.copy2(candidate, out / "PYTHON_LICENSE.txt")
                  break

          seen = set()
          for root in (base / "tcl", Path(sys.executable).parent / "tcl"):
              if not root.is_dir():
                  continue
              for source in root.rglob("license.terms"):
                  key = source.read_bytes()
                  digest = hashlib.sha256(key).hexdigest()
                  if digest in seen:
                      continue
                  seen.add(digest)
                  parent = source.parent.name.replace(" ", "_")
                  shutil.copy2(source, out / f"TCL_TK_{parent}_license.terms")

          ffmpeg = Path(imageio_ffmpeg.get_ffmpeg_exe())
          ffmpeg_version = subprocess.run(
              [str(ffmpeg), "-version"],
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              errors="replace",
              check=True,
          ).stdout.strip()
          ffmpeg_license = subprocess.run(
              [str(ffmpeg), "-L"],
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              errors="replace",
              check=True,
          ).stdout.strip()
          (out / "FFMPEG_RUNTIME_LICENSE_OUTPUT.txt").write_text(ffmpeg_license + "\n", encoding="utf-8")

          ffmpeg_hash = hashlib.sha256(ffmpeg.read_bytes()).hexdigest().upper()
          report = f"""Touhou 6 NC Music Replacer - bundled component report
          Generated by the GitHub Actions Windows release build.

          Python: {sys.version.replace(chr(10), ' ')}
          Tcl: {tkinter.TclVersion}
          Tk: {tkinter.TkVersion}
          imageio-ffmpeg: {md.version('imageio-ffmpeg')}
          tkinterdnd2: {md.version('tkinterdnd2')}
          PyInstaller: {md.version('pyinstaller')}

          Bundled FFmpeg path in build environment: {ffmpeg.name}
          Bundled FFmpeg SHA-256: {ffmpeg_hash}

          FFmpeg -version output:
          {ffmpeg_version}

          FFmpeg -L output:
          {ffmpeg_license}
          """
          Path("BUNDLED_COMPONENTS.txt").write_text(report, encoding="utf-8")
          '@ | python -

          Copy-Item THIRD_PARTY_NOTICES.md third_party_licenses\THIRD_PARTY_NOTICES.md -Force
          Compress-Archive -Path third_party_licenses\* -DestinationPath THIRD_PARTY_LICENSES.zip -Force

      - name: Prepare standalone mode
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("app.pyw")
          text = path.read_text(encoding="utf-8")
          needle = "def _ensure_private_runtime() -> None:\n    if _running_in_private_env():"
          replacement = "def _ensure_private_runtime() -> None:\n    if getattr(sys, \"frozen\", False):\n        return\n    if _running_in_private_env():"
          if needle not in text:
              raise SystemExit("Expected runtime bootstrap block was not found.")
          path.write_text(text.replace(needle, replacement, 1), encoding="utf-8")
          '@ | python -

      - name: Build standalone executable
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "Touhou 6 NC Music Replacer" `
            --collect-all tkinterdnd2 `
            --collect-all imageio_ffmpeg `
            app.pyw

          $exe = "dist\Touhou 6 NC Music Replacer.exe"
          if (!(Test-Path $exe)) {
            throw "PyInstaller did not produce the expected executable."
          }

          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          @"
          Standalone Windows build. No Python installation is required.

          FFmpeg and drag-and-drop support are bundled inside the executable.

          This is an unofficial fan-made utility and is not affiliated with or endorsed by ZUN / Team Shanghai Alice, Shanghai Alice Reprise, or Alliance Arts. No Touhou or New Classic game assets are included in this release.

          Third-party attribution and license material are attached to this release as THIRD_PARTY_NOTICES.md, BUNDLED_COMPONENTS.txt and THIRD_PARTY_LICENSES.zip.

          Windows SmartScreen may warn that the publisher is unknown because this fan-made executable is not code-signed.

          SHA-256: $hash
          "@ | Set-Content -Path RELEASE_NOTES.md -Encoding utf8

      - name: Create GitHub release
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_VERSION `
            "dist\Touhou 6 NC Music Replacer.exe" `
            "THIRD_PARTY_NOTICES.md" `
            "BUNDLED_COMPONENTS.txt" `
            "THIRD_PARTY_LICENSES.zip" `
            --target $env:GITHUB_SHA `
            --title "Touhou 6 NC Music Replacer $env:RELEASE_VERSION" `
            --notes-file RELEASE_NOTES.md

      - name: Add legal notices to existing release
        if: steps.release.outputs.exists == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:RELEASE_VERSION `
            "THIRD_PARTY_NOTICES.md" `
            "BUNDLED_COMPONENTS.txt" `
            "THIRD_PARTY_LICENSES.zip" `
            --clobber

          $body = gh release view $env:RELEASE_VERSION --json body --jq .body
          if ($body -notmatch "THIRD_PARTY_NOTICES.md") {
            $body = $body + "`n`nLegal, attribution and third-party license material is attached as THIRD_PARTY_NOTICES.md, BUNDLED_COMPONENTS.txt and THIRD_PARTY_LICENSES.zip."
            gh release edit $env:RELEASE_VERSION --notes $body
          }
