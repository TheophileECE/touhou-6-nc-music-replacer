name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example v1.0.1)
        required: true
        default: v1.0.0
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || 'v1.0.0' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check whether release already exists
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_VERSION *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }

      - name: Set up Python
        if: steps.release.outputs.exists != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -q --upgrade pip
          python -m pip install --disable-pip-version-check -q -r requirements.txt pyinstaller

      - name: Prepare standalone mode
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("app.pyw")
          text = path.read_text(encoding="utf-8")
          needle = "def _ensure_private_runtime() -> None:\n    if _running_in_private_env():"
          replacement = "def _ensure_private_runtime() -> None:\n    if getattr(sys, \"frozen\", False):\n        return\n    if _running_in_private_env():"
          if needle not in text:
              raise SystemExit("Expected runtime bootstrap block was not found.")
          path.write_text(text.replace(needle, replacement, 1), encoding="utf-8")
          '@ | python -

      - name: Build standalone executable
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "Touhou 6 NC Music Replacer" `
            --collect-all tkinterdnd2 `
            --collect-all imageio_ffmpeg `
            app.pyw

          $exe = "dist\Touhou 6 NC Music Replacer.exe"
          if (!(Test-Path $exe)) {
            throw "PyInstaller did not produce the expected executable."
          }

          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          @"
          Standalone Windows build. No Python installation is required.

          FFmpeg and drag-and-drop support are bundled inside the executable.

          Windows SmartScreen may warn that the publisher is unknown because this fan-made executable is not code-signed.

          SHA-256: $hash
          "@ | Set-Content -Path RELEASE_NOTES.md -Encoding utf8

      - name: Create GitHub release
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_VERSION `
            "dist\Touhou 6 NC Music Replacer.exe" `
            --target $env:GITHUB_SHA `
            --title "Touhou 6 NC Music Replacer $env:RELEASE_VERSION" `
            --notes-file RELEASE_NOTES.md
